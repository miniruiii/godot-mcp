name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest --run --pool=forks --poolOptions.forks.singleFork=true

  godot-plugin-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sL https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.2-stable_linux.x86_64
          mv Godot_v4.6.2-stable_linux.x86_64 /tmp/godot

      - name: Create test project
        run: |
          mkdir -p .godot-test/project/addons/godot_mcp/editors
          cp addons/godot_mcp/*.gd .godot-test/project/addons/godot_mcp/
          cp addons/godot_mcp/editors/*.gd .godot-test/project/addons/godot_mcp/editors/

      - name: Create project.godot
        run: |
          cat > .godot-test/project/project.godot << 'GODOTEOF'
config_version=5
[application]
name="Godot MCP Test"
run/main_scene="res://main.tscn"
[display]
driver/windowers/editor/main_window_mode=0
[editor]
plugin/forbidden_on_first_run=""
[rendering]
renderer/rendering_method="forward_plus"
GODOTEOF

      - name: Create main scene
        run: |
          cat > .godot-test/project/main.tscn << 'TSCNEOF'
[gd_scene load_steps=2 format=3 uid="uid://test"]
[ext_resource type="Script" path="res://test_scripts.gd" id="1"]
[node name="Node2D" type="Node2D"]
script = ExtResource("1")
TSCNEOF

      - name: Create test script
        run: |
          cat > .godot-test/project/test_scripts.gd << 'TESTEOF'
extends MainLoop
var passed = 0
var failed = 0
var done = false
func _initialize():
    print("=== Godot MCP Plugin Compilation Test ===")
    var scripts = [
        "res://addons/godot_mcp/plugin.gd",
        "res://addons/godot_mcp/websocket_server.gd",
        "res://addons/godot_mcp/rpc_handler.gd",
        "res://addons/godot_mcp/utils.gd",
        "res://addons/godot_mcp/editors/scene_editor.gd",
        "res://addons/godot_mcp/editors/script_editor.gd",
        "res://addons/godot_mcp/editors/project_editor.gd",
    ]
    for script_path in scripts:
        var script_res = load(script_path)
        if script_res:
            print("[PASS] %s" % script_path)
            passed += 1
        else:
            print("[FAIL] %s - could not load" % script_path)
            failed += 1
    print("\n=== Results: %d passed, %d failed ===" % [passed, failed])
    if failed > 0:
        print("FAILED")
    else:
        print("SUCCESS")
    done = true
func _process(_delta):
    pass
func _exit():
    pass
TESTEOF

      - name: Run Godot headless test
        run: |
          /tmp/godot --headless --path .godot-test/project --script .godot-test/project/test_scripts.gd 2>&1
          echo "Exit code: $?"

      - name: Verify test output
        run: |
          /tmp/godot --headless --path .godot-test/project --script .godot-test/project/test_scripts.gd 2>&1 | grep -q "7 passed, 0 failed" && echo "Godot plugin scripts compile successfully"